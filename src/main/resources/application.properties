spring.application.name=ArenaParser
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=${BACKEND_HOST:127.0.0.1}
server.port=${BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:arenaparser}
spring.datasource.username=${POSTGRES_USER:arenaparser}
spring.datasource.password=${POSTGRES_PASSWORD:}

arenaparser.combat-log-path=${ARENAPARSER_COMBAT_LOG_PATH:}
arenaparser.combat-log-zone=${ARENAPARSER_COMBAT_LOG_ZONE:Europe/Stockholm}
arenaparser.auto-import-enabled=${ARENAPARSER_AUTO_IMPORT_ENABLED:true}
arenaparser.auto-import-interval-ms=${ARENAPARSER_AUTO_IMPORT_INTERVAL_MS:5000}
